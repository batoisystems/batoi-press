name: Regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, sodium, curl, mbstring, dom
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find public_html radpress .github/scripts -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: PHP and JavaScript regressions
        run: php .github/scripts/run-tests.php
